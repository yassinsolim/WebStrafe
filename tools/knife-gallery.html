<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebStrafe knife gallery (dev only)</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&display=swap" />
    <style>
      html, body { margin: 0; background: #20242b; color: #f0f0ea; font-family: 'Barlow Semi Condensed', sans-serif; }
      canvas { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <!-- dev tool: npm run dev, then open /tools/knife-gallery.html (?fold=0.5 swings folders and the balisong) -->
    <script type="module">
      import {
        ACESFilmicToneMapping, AmbientLight, Box3, CanvasTexture, DirectionalLight, Group, Mesh, OrthographicCamera, PlaneGeometry,
        MeshBasicMaterial, PMREMGenerator, Scene, SRGBColorSpace, Vector3, WebGLRenderer,
      } from 'three';
      import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
      import { KNIVES } from '/src/combat/knives.ts';
      import { sharedGltfLoader } from '/src/assets/gltfLoader.ts';

      const params = new URLSearchParams(location.search);
      const fold = Number(params.get('fold') ?? 0);
      const cols = window.innerWidth < 700 ? 2 : 4;
      const rows = Math.ceil(KNIVES.length / cols);
      const cell = 0.38;
      const width = Number(params.get('width') ?? Math.min(1440, innerWidth * (devicePixelRatio || 1)));
      const height = Math.round((width * rows) / cols);
      const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(width, height, false);
      renderer.setClearColor(0x20242b);
      renderer.outputColorSpace = SRGBColorSpace;
      renderer.toneMapping = ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);
      const scene = new Scene();
      // same studio environment the viewmodel scene uses, metals need something to reflect
      const pmrem = new PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.add(new AmbientLight(0xffffff, 0.35));
      const key = new DirectionalLight(0xffffff, 1.6);
      key.position.set(0.4, 1, 1.2);
      scene.add(key);
      const halfW = (cols * cell) / 2;
      const halfH = (rows * cell) / 2;
      const camera = new OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.01, 10);
      camera.position.set(0, 0, 3);

      await document.fonts.load('600 36px "Barlow Semi Condensed"').catch(() => []);
      const models = [];
      for (const [i, def] of KNIVES.entries()) {
        const cx = -halfW + cell * (i % cols) + cell / 2;
        const cy = halfH - cell * Math.floor(i / cols) - cell / 2;
        const source = `/knives/${def.id}${params.get('lod') === '0' ? '' : '_lod1'}.glb`;
        const loaded = await sharedGltfLoader().loadAsync(source);
        const knife = loaded.scene;
        if (fold) {
          knife.getObjectByName('blade_pivot')?.rotation.set(0, 0, -Math.PI * fold);
          knife.getObjectByName('handle_safe')?.rotation.set(0, 0, -Math.PI * fold);
          knife.getObjectByName('handle_bite')?.rotation.set(0, 0, Math.PI * fold);
        }
        const model = new Group();
        model.add(knife);
        if (def.shape.pair) {
          const partner = knife.clone(true);
          partner.rotation.z = Math.PI;
          partner.position.y = 0.055;
          knife.position.y = -0.035;
          model.add(partner);
        }
        const center = new Box3().setFromObject(model).getCenter(new Vector3());
        model.position.copy(center).negate();
        const holder = new Group();
        holder.add(model);
        holder.rotation.set(-0.25, Math.PI - 0.28, -0.45);
        const size = new Box3().setFromObject(holder).getSize(new Vector3());
        holder.scale.setScalar(cell * 0.82 / Math.max(size.x, size.y));
        holder.position.set(cx, cy + 0.025, 0);
        scene.add(holder);
        models.push({ id: def.id, source, holder });

        const c = document.createElement('canvas');
        c.width = 512; c.height = 64;
        const g = c.getContext('2d');
        g.fillStyle = '#f0f0ea'; g.font = '600 36px "Barlow Semi Condensed", sans-serif'; g.textAlign = 'center';
        g.fillText(def.name, 256, 42);
        const label = new Mesh(new PlaneGeometry(cell * 0.95, cell * 0.12), new MeshBasicMaterial({ map: new CanvasTexture(c), transparent: true }));
        label.position.set(cx, cy - cell * 0.36, 0.5);
        scene.add(label);
      }
      renderer.render(scene, camera);
      window.__knifeGallery = { renderer, scene, camera, models };
      window.__galleryReady = true;
    </script>
  </body>
</html>
