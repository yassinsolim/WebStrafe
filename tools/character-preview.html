<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebStrafe armored characters (dev only)</title>
    <style>
      html, body { margin: 0; background: #0d1015; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <!-- dev tool: a line-up of armored characters in the knife stance.
         ?looks=<wire>,<wire> picks looks (default: every preset), ?team=ct,
         ?view=front|back|side|quarter, ?lod=0|1|2, ?w=&h= canvas size,
         ?bind=1 shows the bind pose instead of the stance -->
    <script type="module">
      import { Quaternion, Vector3,
        ACESFilmicToneMapping, AmbientLight, CircleGeometry, Color, DirectionalLight, HemisphereLight, Mesh,
        MeshStandardMaterial, PerspectiveCamera, PMREMGenerator, Scene, SRGBColorSpace, WebGLRenderer,
      } from 'three';
      import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
      import { createCharacter, provideCharacterLibrary } from '/src/characters/CharacterFactory.ts';
      import { CharacterLibrary } from '/src/characters/library.ts';
      import { setCharacterDetail } from '/src/characters/ArmorCharacter.ts';
      import { BUILTIN_PRESETS } from '/src/characters/presets.ts';
      import { decodeLook, defaultLook } from '/src/characters/look.ts';
      import { attachKnifeModel, loadKnifeMesh } from '/src/multiplayer/playerRig.ts';

      const params = new URLSearchParams(location.search);
      const width = Number(params.get('w') ?? 1920);
      const height = Number(params.get('h') ?? 1080);
      const team = params.get('team') === 'ct' ? 'counterterrorist' : 'terrorist';
      const view = params.get('view') ?? 'front';
      const lod = params.has('lod') ? Number(params.get('lod')) : 0;
      // ?lods=0,1,2 pins a level per character (side by side lod comparisons)
      const lods = params.get('lods') ? params.get('lods').split(',').map(Number) : null;
      const bind = params.get('bind') === '1';
      const looks = params.get('looks')
        ? params.get('looks').split(',').map((w) => decodeLook(w, defaultLook(team)) ?? defaultLook(team))
        : BUILTIN_PRESETS.map((p) => p.look);

      const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(width, height);
      renderer.outputColorSpace = SRGBColorSpace;
      renderer.toneMapping = ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      document.body.appendChild(renderer.domElement);
      const scene = new Scene();
      scene.background = new Color(0x0d1015);
      const pmrem = new PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.55;
      scene.add(new HemisphereLight(0xcfe0ff, 0x1a1712, 0.6));
      scene.add(new AmbientLight(0xffffff, 0.08));
      const key = new DirectionalLight(0xfff0e0, 2.4);
      key.position.set(-3, 5, 4);
      scene.add(key);
      const rim = new DirectionalLight(0x9fc4ff, 1.6);
      rim.position.set(3, 3, -4);
      scene.add(rim);
      const floor = new Mesh(new CircleGeometry(40, 64), new MeshStandardMaterial({ color: 0x181c22, roughness: 0.9 }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // ?detail=low draws without the baked atlas (lod stays pinned by ?lod=)
      if (params.get('detail')) setCharacterDetail(params.get('detail'));
      if (params.get('lib')) provideCharacterLibrary(await CharacterLibrary.load(params.get('lib')));
      const knife = await loadKnifeMesh();
      const spacing = 1.05;
      const chars = [];
      for (const [i, look] of looks.entries()) {
        const ch = await createCharacter(look, i % 2 === 0 ? team : (team === 'terrorist' ? 'counterterrorist' : 'terrorist'), { pose: bind ? 'none' : 'stance', lod: lods ? lods[i % lods.length] : lod });
        ch.root.position.x = (i - (looks.length - 1) / 2) * spacing;
        const yaw = { front: 0, back: Math.PI, side: Math.PI / 2, quarter: 0.6 }[view] ?? 0;
        ch.root.rotation.y = yaw;
        if (ch.rig && !bind) attachKnifeModel(ch.rig.rightWeaponHand, knife);
        scene.add(ch.root);
        chars.push(ch);
      }
      const fov = Number(params.get('fov') ?? 24);
      const camera = new PerspectiveCamera(fov, width / height, 0.05, 100);
      const span = Math.max(2.0, looks.length * spacing * 0.62);
      const dist = params.has('dist') ? Number(params.get('dist')) : span / Math.tan((fov * Math.PI) / 360) * 0.55;
      const lookY = Number(params.get('y') ?? 0.95);
      camera.position.set(Number(params.get('x') ?? 0), lookY + Number(params.get('up') ?? 0.3), dist);
      camera.lookAt(Number(params.get('x') ?? 0), lookY, 0);
      // extreme test poses on top of the stance (plate gap checks): model space axes, the model faces +z
      const poseName = params.get('pose');
      const POSES = {
        crouch: { drop: 0.36, x: { spine_1: 0.18, spine_2: 0.16, neck_0: -0.2, head_0: -0.14, leg_upper_l: -1.45, leg_upper_r: -1.35, leg_lower_l: 2.25, leg_lower_r: 2.1, ankle_l: -0.8, ankle_r: -0.75 } },
        aimup: { x: { spine_2: -0.3, spine_3: -0.3, neck_0: -0.35, head_0: -0.4 } },
        aimdown: { x: { spine_2: 0.32, spine_3: 0.3, neck_0: 0.35, head_0: 0.4 } },
        run: { y: { spine_2: 0.22, spine_3: 0.14 }, x: { spine_1: 0.14, leg_upper_l: -1.0, leg_upper_r: 0.55, leg_lower_l: 0.5, leg_lower_r: 1.45, ankle_l: -0.2, ankle_r: 0.35 } },
        inspect: { x: { arm_upper_r: -0.5 }, twist: { arm_lower_r: 1.4, hand_r: 0.5 } },
      };
      const qa = new Quaternion(), qp = new Quaternion();
      function rotW(root, name, axis, angle) {
        const bone = [];
        root.traverse((n) => { if (n.isBone && n.name.replace(/_\d+$/, '') === name) bone.push(n); });
        if (!bone[0]) return;
        const b = bone[0];
        b.parent.updateWorldMatrix(true, false);
        b.parent.getWorldQuaternion(qp);
        root.getWorldQuaternion(qa);
        // axis given in the character's model space
        const w = new Quaternion().setFromAxisAngle(axis.clone().applyQuaternion(qa), angle);
        b.quaternion.premultiply(qp.clone().invert().multiply(w).multiply(qp));
      }
      function twist(root, name, angle) {
        root.traverse((n) => { if (n.isBone && n.name.replace(/_\d+$/, '') === name) n.quaternion.multiply(new Quaternion().setFromAxisAngle(new Vector3(1, 0, 0), angle)); });
      }
      function applyPose(ch) {
        const pose = POSES[poseName];
        if (!pose) return;
        for (const [n, a] of Object.entries(pose.x ?? {})) rotW(ch.root, n, new Vector3(1, 0, 0), a);
        for (const [n, a] of Object.entries(pose.y ?? {})) rotW(ch.root, n, new Vector3(0, 1, 0), a);
        for (const [n, a] of Object.entries(pose.twist ?? {})) twist(ch.root, n, a);
        if (pose.drop) {
          ch.root.traverse((n) => { if (n.isBone && n.name.startsWith('pelvis')) n.position.y -= pose.drop; });
        }
      }
      let t = 0;
      function frame() {
        t += 1 / 60;
        for (const ch of chars) {
          ch.update(1 / 60, 1.2 + (bind ? 0 : t * 0));
        }
        renderer.render(scene, camera);
      }
      for (let i = 0; i < 20; i += 1) frame();
      // once, after the stance settled: the stance doesn't reset legs and spine, so per frame it would pile up
      for (const ch of chars) applyPose(ch);
      renderer.render(scene, camera);
      const info = renderer.info.render;
      window.__shotInfo = { calls: info.calls, triangles: info.triangles };
      window.__chars = chars;
      window.__shotReady = true;
    </script>
  </body>
</html>
