<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebStrafe viewmodel preview (dev only)</title>
    <style>
      html, body { margin: 0; background: #1b1f26; color: #cfd6e0; font: 13px system-ui, sans-serif; }
      canvas { display: block; }
      #ids { position: absolute; left: 8px; bottom: 8px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <!-- dev tool: /tools/viewmodel-preview.html?item=deagle|awp|knife&knife=<id>&clip=idle|draw|fire|reload|inspect|slashA|slashB|stab
         &t=<seconds into the clip>&time=HH:MM:SS (freezes the watch)&view=fp|side|top|left&width=1600&bg=map&scale=0.5..1.5
         &finish=<finish or variant id>&wear=<0..1 float>&seed=<0..999> puts a knife finish on
         sets window.__viewmodelReady and document.title = 'ready' once the frame is drawn -->
    <div id="ids"></div>
    <script type="module">
      import {
        ACESFilmicToneMapping, Color, PerspectiveCamera, PMREMGenerator, SRGBColorSpace, WebGLRenderer,
      } from 'three';
      import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
      import { ViewmodelRenderer } from '/src/cosmetics/ViewmodelRenderer.ts';
      import { ViewmodelSystem } from '/src/viewmodel/ViewmodelSystem.ts';
      import { configureTextureTranscoder } from '/src/assets/gltfLoader.ts';
      import { KNIVES } from '/src/combat/knives.ts';

      const params = new URLSearchParams(location.search);
      const item = params.get('item') ?? 'deagle';
      const clip = params.get('clip') ?? 'idle';
      const t = Number(params.get('t') ?? 0);
      const view = params.get('view') ?? 'fp';
      const width = Number(params.get('width') ?? 1600);
      const height = Math.round(width * 9 / 16);

      const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(width, height);
      renderer.setClearColor(new Color(params.get('bg') ?? '#2a3038'));
      renderer.outputColorSpace = SRGBColorSpace;
      renderer.toneMapping = ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);
      configureTextureTranscoder(renderer);

      const vm = new ViewmodelRenderer(Number(params.get('fov') ?? 68), width / height);
      vm.scene.environment = new PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      const system = new ViewmodelSystem();
      vm.camera.add(system.root);
      const time = params.get('time');
      if (time) {
        const [h, m, s] = time.split(':').map(Number);
        const d = new Date();
        d.setHours(h, m ?? 0, s ?? 0, 0);
        system.setClockOverride(d);
      }
      document.getElementById('ids').textContent = 'knives: ' + KNIVES.map((k) => k.id).join(', ');

      await system.load();
      if (params.get('scale')) system.setScale(Number(params.get('scale')));
      if (params.get('finish')) {
        system.setKnifeFinish({ finishId: params.get('finish'), wear: Number(params.get('wear') ?? 0), seed: Number(params.get('seed') ?? 0) });
      }
      if (params.get('knife')) system.setKnife(params.get('knife'));
      system.equip(item);
      // the blender knife loads after the procedural stand-in: wait for it so the
      // preview shows what the game shows
      if (item === 'knife') {
        for (let i = 0; i < 60 && system.getKnifeObjects()[0]?.userData.source !== 'glb'; i += 1) {
          await new Promise((r) => setTimeout(r, 50));
        }
      }
      if (params.get('markers')) system.showFingerMarkers(true);
      system.seek(clip, t);
      if (item === 'knife') {
        // the blender model swaps in after it loads; shoot that, not the procedural stand-in
        for (let i = 0; i < 200 && system.knife?.knife?.userData.source !== 'glb'; i += 1) {
          await new Promise((r) => setTimeout(r, 25));
        }
        if (params.get('finish')) {
          system.setKnifeFinish({ finishId: params.get('finish'), wear: Number(params.get('wear') ?? 0), seed: Number(params.get('seed') ?? 0) });
        }
        system.seek(clip, t);
      }

      let camera = vm.camera;
      if (view !== 'fp') {
        // outside views for checking hand placement
        camera = new PerspectiveCamera(40, width / height, 0.01, 20);
        // target=hand centres the outside views on the live right hand
        const handAt = () => {
          const v = system.getHandWorldPosition();
          return [v.x, v.y, v.z];
        };
        const target = params.get('target') === 'hand' ? handAt() : (params.get('target') ?? '0.05,-0.18,-0.3').split(',').map(Number);
        const dist = Number(params.get('dist') ?? 0.9);
        const pos = view === 'side' ? [target[0] + dist, target[1] + 0.05, target[2]]
          : view === 'left' ? [target[0] - dist, target[1] + 0.05, target[2]]
          : view === 'top' ? [target[0], target[1] + dist, target[2] + 0.001]
          : view === 'bottom' ? [target[0], target[1] - dist, target[2] + 0.001]
          : view === 'front' ? [target[0], target[1] + 0.02, target[2] - dist]
          : [target[0] + dist * 0.6, target[1] + dist * 0.3, target[2] - dist * 0.6];
        camera.position.set(...pos);
        camera.lookAt(...target);
        vm.scene.add(camera);
      }
      renderer.render(vm.scene, camera);
      // scripts measure and re-pose through this (seek, then render)
      window.__vm = { system, camera, fpCamera: vm.camera, render: () => renderer.render(vm.scene, camera) };
      window.__viewmodelReady = true;
      document.title = 'ready';
    </script>
  </body>
</html>
