# optional free fallback: Render blueprint for the game server.
# free plan limits (verified 2026-09-27): 0.1 cpu / 512 MB, sleeps after 15 min
# with no inbound traffic (~1 min wake), 750 instance hours and 5 GB outbound
# bandwidth per month on the hobby workspace. 0.1 cpu is below what the bot
# sim measured locally, so bots are off here.
services:
  - type: web
    name: webstrafe-game
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: HOST
        value: 0.0.0.0
      - key: ENABLE_BOTS
        value: "false"
      - key: WEBSTRAFE_ALLOWED_ORIGINS
        value: https://strafe.yassin.app
      - key: WEBSTRAFE_ALLOWED_ORIGIN_SUFFIXES
        value: -yassins-projects-11732a5e.vercel.app
