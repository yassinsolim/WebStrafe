# Fly.io config for the WebStrafe dedicated game server (WebSocket + bots + API).
# The static client stays on Vercel; this machine only runs server/index.ts.
# A persistent WS server must NOT auto-stop, or sockets drop when idle.

app = "webstrafe-game"
# sea (seattle) is no longer offered; this is the lowest measured rtt from calgary
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  ENABLE_BOTS = "true"
  BOTS_PER_MAP = "2"
  SNAPSHOT_RATE_HZ = "30"
  # behind fly's proxy only Fly-Client-IP is trustworthy for rate limiting
  TRUST_PROXY = "fly"
  WEBSTRAFE_DATA_DIR = "/tmp/webstrafe"
  # production frontend plus this vercel team's preview deployments
  WEBSTRAFE_ALLOWED_ORIGINS = "https://strafe.yassin.app"
  WEBSTRAFE_ALLOWED_ORIGIN_SUFFIXES = "-yassins-projects-11732a5e.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  # keep the machine alive so long-lived websockets are not dropped
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# surf_skyworld_x collision peaks at ~390 MB rss while loading; 1 GB leaves headroom
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
